<svg xmlns="http://www.w3.org/2000/svg" width="480" height="158" viewBox="0 0 480 158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Scanline overlay pattern -->
    <pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" y="2" fill="#000000" opacity="0.10"/>
    </pattern>
    <!-- Gold glow filter for username -->
    <filter id="goldglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="158" rx="12" fill="url(#ibg)"/>

  <!-- Border — gold, 1px -->
  <rect x="0.5" y="0.5" width="479" height="157" rx="12" fill="none" stroke="#ffcc00" stroke-width="1"/>

  <!-- Title bar separator -->
  <line x1="0" y1="30" x2="480" y2="30" stroke="#ffcc00" stroke-width="0.8"/>

  <!-- macOS window dots -->
  <circle cx="20" cy="15" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="15" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="15" r="5" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="240" y="19.5" fill="#7d8590" font-size="12" text-anchor="middle">8sujan6@github: ~$ neofetch</text>

  <!-- ── username@github header (slide up + fade in) ── -->
  <g opacity="0" transform="translate(0,6)">
    <text x="20" y="60" font-size="14" font-weight="700" filter="url(#goldglow)">
      <tspan fill="#00ff66">8sujan6</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#ff6e6e">github</tspan>
    </text>
    <!-- separator line -->
    <line x1="134" y1="56" x2="460" y2="56" stroke="#ffcc00" stroke-opacity="0.6" stroke-dasharray="3 5"/>
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0"
      begin="0.15s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <!-- ── Now ── -->
  <g opacity="0" transform="translate(0,6)">
    <text x="20" y="86" fill="#ffcc00" font-size="12.5" font-weight="700">Now</text>
    <!-- value -->
    <text x="112" y="86" fill="#e6edf3" font-size="12.5">MCA</text>
    <text x="148" y="86" fill="#8b949e" font-size="12.5">@</text>
    <text x="162" y="86" fill="#58a6ff" font-size="12.5" font-weight="600">BMSIT</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0"
      begin="0.36s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <!-- ── Prev ── -->
  <g opacity="0" transform="translate(0,6)">
    <text x="20" y="112" fill="#ffcc00" font-size="12.5" font-weight="700">Prev</text>
    <!-- value -->
    <text x="112" y="112" fill="#e6edf3" font-size="12.5">BCA</text>
    <text x="148" y="112" fill="#8b949e" font-size="12.5">@</text>
    <text x="162" y="112" fill="#58a6ff" font-size="12.5" font-weight="600">REVA University</text>
    <animate attributeName="opacity" from="0" to="1" begin="0.57s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0"
      begin="0.57s" dur="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </g>

  <!-- ── Blinking cursor ── -->
  <rect x="20" y="128" width="8" height="13" fill="#ffcc00" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.78;0.78;0.89;0.89;1"
      dur="1.2s" begin="0.92s" repeatCount="indefinite"/>
  </rect>

  <!-- CRT scanline overlay (very subtle) -->
  <rect width="480" height="158" rx="12" fill="url(#scan)" opacity="1"/>
</svg>