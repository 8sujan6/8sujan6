name: Update Stats

on:
  schedule:
    # Run every day at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  push:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to commit the regenerated SVGs back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stat SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_LOGIN: 8sujan6
          OUT_DIR: .
        run: python scripts/generate_stats.py

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg streak.svg langs.svg year.svg \
                  hd-about.svg hd-stack.svg hd-projects.svg \
                  hd-stats.svg hd-about-this-page.svg
          git diff --cached --quiet || \
            git commit -m "chore(bot): refresh stats [skip ci]"
          git push
